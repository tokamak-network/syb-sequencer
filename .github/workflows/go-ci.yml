name: Go CI Lint, Build, and Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
        id: go

      - name: Check out code
        uses: actions/checkout@v4

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.58
          working-directory: sequencer

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
        id: go

      - name: Check out code
        uses: actions/checkout@v4

      - name: Tidy modules
        working-directory: sequencer
        run: go mod tidy

      - name: Build
        working-directory: sequencer
        run: go build -v ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
        id: go

      - name: Check out code
        uses: actions/checkout@v4

      - name: Tidy modules
        working-directory: sequencer
        run: go mod tidy

      - name: Test
        working-directory: sequencer
        run: go test -v ./...
